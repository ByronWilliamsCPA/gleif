# GLEIF Golden Copy CLI - Static Analysis
#
# Blocking gate for checks that previously ran only in local pre-commit hooks
# or in advisory (comment-mode) tooling, so they could be skipped without CI
# noticing:
#   - basedpyright (strict) type checking
#   - semgrep security rules (.semgrep.yaml, ERROR severities)
#   - pip-audit with the accepted-vulnerability suppressions applied explicitly
#
# pip-audit's CLI does not read [tool.pip-audit] from pyproject.toml, so the
# --ignore-vuln flags below are the authoritative suppression for the vulns
# documented in docs/known-vulnerabilities.md.

name: Static Analysis

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install UV
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      - name: Type check (basedpyright strict)
        run: uv run basedpyright src

      - name: Security scan (semgrep)
        # Pin the semgrep version so a new release cannot change parsing/rules
        # and fail a previously-green PR. Bump deliberately.
        run: uvx --from 'semgrep==1.164.0' semgrep --config .semgrep.yaml --error src

      - name: Dependency audit (pip-audit)
        run: >-
          uv run pip-audit
          --ignore-vuln PYSEC-2022-42969
          --ignore-vuln PYSEC-2026-89

      - name: Secret scan (detect-secrets)
        # Blocking check so the baseline is enforced in CI, not only via the
        # contributor pre-commit hook. NUL-delimit the file list so paths with
        # spaces or globs are not word-split, and so a large tree does not blow
        # the ARG_MAX limit of a single argv.
        run: git ls-files -z | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline
