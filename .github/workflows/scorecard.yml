name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 1'
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    # yamllint disable rule:line-length
    uses: ByronWilliamsCPA/.github/.github/workflows/python-scorecard.yml@62bfd795d1273b4819a3f66aa9cef0b917acb830 # main
    # yamllint enable rule:line-length
    permissions:
      security-events: write
      contents: read
      actions: read
    secrets:
      SCORECARD_TOKEN: ${{ secrets.SCORECARD_TOKEN }}
