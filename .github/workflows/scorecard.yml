name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 1'
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    # yamllint disable rule:line-length
    uses: ByronWilliamsCPA/.github/.github/workflows/python-scorecard.yml@74cfc8e9d1ea1f6babc40bea102b3071af620942 # main
    # yamllint enable rule:line-length
    permissions:
      security-events: write
      contents: read
      actions: read
    secrets:
      SCORECARD_TOKEN: ${{ secrets.SCORECARD_TOKEN }}
