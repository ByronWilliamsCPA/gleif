# GLEIF Golden Copy CLI - CI Pipeline
#
# Thin caller for the org-level python-ci.yml reusable workflow, which runs
# formatting, linting, type checking, and the test suite.

name: CI

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ByronWilliamsCPA/.github/.github/workflows/python-ci.yml@6f71aecae2c91214ca0a0a2206a36cf912aa31ac # main
    permissions:
      contents: read
      checks: write
      pull-requests: write
    with:
      python-version: '3.12'
      source-directory: src
      no-build: false
      coverage-threshold: 65

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci]
    if: always()
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5  # v2.19.3
        with:
          egress-policy: audit

      - name: Validate CI Results
        run: |
          if [[ "${{ needs.ci.result }}" == "success" ]]; then
            echo "CI Pipeline - All Checks Passed"
          else
            echo "CI Pipeline Failed"
            echo "ci: ${{ needs.ci.result }}"
            exit 1
          fi
