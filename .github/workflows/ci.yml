# GLEIF Golden Copy CLI - CI Pipeline
#
# Thin caller for the org-level python-ci.yml reusable workflow, which runs
# formatting, linting, type checking, and the test suite.

name: CI

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ByronWilliamsCPA/.github/.github/workflows/python-ci.yml@e067cdb7294f6221dbde74ef1f4c3ca735eed570 # main
    permissions:
      contents: read
      checks: write
      pull-requests: write
    with:
      python-version: '3.11'
      source-directory: src

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci]
    if: always()
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450  # v2.19.1
        with:
          egress-policy: audit

      - name: Validate CI Results
        run: |
          if [[ "${{ needs.ci.result }}" == "success" ]]; then
            echo "CI Pipeline - All Checks Passed"
          else
            echo "CI Pipeline Failed"
            echo "ci: ${{ needs.ci.result }}"
            exit 1
          fi
