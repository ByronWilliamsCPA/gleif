# GLEIF Golden Copy CLI - Security Analysis
#
# Thin caller for the org-level python-security-analysis.yml reusable workflow,
# which centralizes dependency review, Bandit, OSV, and related scans. CodeQL
# is disabled here because the dedicated codeql.yml workflow already runs it.

name: Security Analysis

on:
  merge_group:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
  schedule:
    - cron: '30 2 * * 1'  # Weekly Monday 2:30 AM UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name }}-security-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security Analysis
    # yamllint disable rule:line-length
    uses: ByronWilliamsCPA/.github/.github/workflows/python-security-analysis.yml@6f71aecae2c91214ca0a0a2206a36cf912aa31ac # main
    # yamllint enable rule:line-length
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read
    with:
      python-version: '3.11'
      source-directory: src
      no-build: false
      # CodeQL is handled by the dedicated codeql.yml workflow.
      # OSV is redundant with pip-audit. pip-audit's accepted-vulnerability
      # suppressions (docs/known-vulnerabilities.md) are applied as explicit
      # --ignore-vuln flags in static-analysis.yml; pip-audit's CLI does not
      # read [tool.pip-audit] from pyproject.toml.
      run-codeql: false
      run-osv: false
