# GLEIF Golden Copy CLI - Security Analysis
#
# Thin caller for the org-level python-security-analysis.yml reusable workflow,
# which centralizes dependency review, Bandit, OSV, and related scans. CodeQL
# is disabled here because the dedicated codeql.yml workflow already runs it.

name: Security Analysis

on:
  merge_group:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
  schedule:
    - cron: '30 2 * * 1'  # Weekly Monday 2:30 AM UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name }}-security-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security Analysis
    # yamllint disable rule:line-length
    uses: ByronWilliamsCPA/.github/.github/workflows/python-security-analysis.yml@987d517d3c8e4b180f4dd15de6d9575f0df91182 # main
    # yamllint enable rule:line-length
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read
    with:
      python-version: '3.12'
      source-directory: src
      no-build: false
      # CodeQL is handled by the dedicated codeql.yml workflow.
      # OSV is redundant with pip-audit. pip-audit's accepted-vulnerability
      # suppressions (docs/known-vulnerabilities.md) are applied as explicit
      # --ignore-vuln flags in static-analysis.yml; pip-audit's CLI does not
      # read [tool.pip-audit] from pyproject.toml.
      run-codeql: false
      run-osv: false

  # Bare "Security Gate Validation" context required by the org ruleset.
  # The reusable security workflow surfaces as
  # "Security Analysis / Security Gate Validation" (caller / reusable job),
  # which cannot match the bare ruleset context. This in-line aggregator
  # re-emits the bare context on pull_request and inside the merge queue.
  security-gate:
    name: Security Gate Validation
    runs-on: ubuntu-latest
    needs: [security]
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: ''
      - name: Aggregate security result
        run: |
          result="${{ needs.security.result }}"
          if [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
            echo "Security Gate Validation: passed (result: $result)"
          else
            echo "::error::Security Gate Validation failed: $result"
            exit 1
          fi
