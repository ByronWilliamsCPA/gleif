# GLEIF Golden Copy CLI - Security Analysis
#
# Thin caller for the org-level python-security-analysis.yml reusable workflow,
# which centralises dependency review, Bandit, OSV, and related scans.

name: Security Analysis

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
  schedule:
    - cron: '30 2 * * 1'  # Weekly Monday 2:30 AM UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name }}-security-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security Analysis
    uses: ByronWilliamsCPA/.github/.github/workflows/python-security-analysis.yml@e067cdb7294f6221dbde74ef1f4c3ca735eed570 # main
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    with:
      python-version: '3.11'
      source-directory: src
