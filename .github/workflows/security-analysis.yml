# GLEIF Golden Copy CLI - Security Analysis
#
# Thin caller for the org-level python-security-analysis.yml reusable workflow,
# which centralizes dependency review, Bandit, OSV, and related scans. CodeQL
# is disabled here (run-codeql: false, below); GitHub now bills Advanced
# Security (Code Security), so CodeQL no longer functions fleet-wide. The
# dedicated codeql.yml/reusable-codeql.yml workflows that used to cover this
# were removed. Leaving run-codeql: false as-is; a follow-up removes the
# input line once the shared reusable workflow drops the option.

name: Security Analysis

on:
  merge_group:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
  schedule:
    - cron: '30 2 * * 1'  # Weekly Monday 2:30 AM UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name }}-security-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security Analysis
    # yamllint disable rule:line-length
    uses: ByronWilliamsCPA/.github/.github/workflows/python-security-analysis.yml@987d517d3c8e4b180f4dd15de6d9575f0df91182 # main
    # yamllint enable rule:line-length
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read
    with:
      python-version: '3.12'
      source-directory: src
      no-build: false
      # CodeQL is removed fleet-wide (GitHub now bills Advanced Security);
      # the dedicated codeql.yml/reusable-codeql.yml workflows are gone.
      # OSV is redundant with pip-audit. pip-audit's accepted-vulnerability
      # suppressions (docs/known-vulnerabilities.md) are applied as explicit
      # --ignore-vuln flags in static-analysis.yml; pip-audit's CLI does not
      # read [tool.pip-audit] from pyproject.toml.
      run-codeql: false
      run-osv: false

  security-gate-validation:
    # `security` above has `uses:`, so it is a reusable-workflow caller job.
    # A caller job's status-check context is always
    # "<this job's name> / <inner job name>", unconditionally; it can never
    # emit a bare context, even though the callee itself has its own
    # internal job named "Security Gate Validation" (python-security-
    # analysis.yml's security-gate job). That internal job's context here is
    # "Security Analysis / Security Gate Validation", which never matches
    # the org ruleset's required bare context "Security Gate Validation".
    # This normal job (no uses:) exists solely to emit that bare context.
    # #CRITICAL: do not remove this job or give it a uses:; either change
    # would stop the required check from ever reporting, leaving every PR
    # BLOCKED as "Expected" forever. #VERIFY against the org ruleset's
    # required_status_checks before touching this job again.
    name: Security Gate Validation
    runs-on: ubuntu-latest
    needs: [security]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check security scan results
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          if [ "$SECURITY_RESULT" = "success" ] || [ "$SECURITY_RESULT" = "skipped" ]; then
            echo "Security Gate passed"
          else
            echo "Security Gate failed: $SECURITY_RESULT"
            exit 1
          fi
