# GLEIF Golden Copy CLI - Release Pipeline
#
# Thin caller for the org-level python-release.yml reusable workflow, which
# builds and signs the distribution, generates the SBOM, and publishes the
# GitHub release.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  release:
    uses: ByronWilliamsCPA/.github/.github/workflows/python-release.yml@e067cdb7294f6221dbde74ef1f4c3ca735eed570 # main
    permissions:
      contents: write
      id-token: write
    with:
      python-version: '3.11'
      source-directory: src
