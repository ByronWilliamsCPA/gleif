# GLEIF Golden Copy CLI - Release Pipeline
#
# Thin caller for the org-level python-release.yml reusable workflow, which
# builds and signs the distribution, generates the SBOM, and publishes the
# GitHub release.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  release:
    uses: ByronWilliamsCPA/.github/.github/workflows/python-release.yml@1b2d33c47cc11a96b9757b49f41873c54e75f57c # main
    permissions:
      contents: write
      id-token: write
      attestations: write
      issues: write
      pull-requests: write
    with:
      python-version: '3.11'
      source-directory: src
      no-build: false
      semantic-release: false
      publish-to-pypi: false
