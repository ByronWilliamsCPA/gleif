# SBOM & Security Scan - Calls Org-Level Reusable Workflow
# This is a lightweight caller workflow that invokes the organization's
# shared SBOM generation and security scanning workflow.
#
# Features:
#   - CycloneDX SBOM generation
#   - Trivy vulnerability scanning
#   - License compliance checking
#   - SARIF upload to GitHub Security tab
name: SBOM & Security Scan

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/sbom.yml"
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    # Weekly scan every Monday at 8:00 AM UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name }}-sbom-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sbom:
    name: SBOM & Security
    uses: ByronWilliamsCPA/.github/.github/workflows/python-sbom.yml@6f71aecae2c91214ca0a0a2206a36cf912aa31ac  # main
    permissions:
      contents: read
      security-events: write
    with:
      python-version: '3.12'
      fail-on-vulnerabilities: true
      severity-threshold: 'CRITICAL,HIGH'
      artifact-retention-days: 90
      fail-on-forbidden-licenses: false
      # gleif is an editable source install with no binary distribution, so uv
      # sync must be allowed to build from source. The reusable workflow's
      # no-build default flipped to true at SHA e7781b3 (upstream PR #103).
      no-build: false
