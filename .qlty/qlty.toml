config_version = "0"

# ---------------------------------------------------------------------------
# Top-level smells configuration
# ---------------------------------------------------------------------------

exclude_patterns = [
  # Build artifacts and dependencies
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "build/",
  "dist/",
  "node_modules/",
  "vendor/",
  ".venv/",
  "*.egg-info/",

  # Cache directories
  "cache/",
  ".mypy_cache/",
  ".ruff_cache/",
  ".pytest_cache/",
  "__pycache__/",

  # Claude and temp directories
  "**/.claude/**",
  "tmp_cleanup/",

  # Generated files
  "*.lock",
  "htmlcov/",
  ".coverage",
]

test_patterns = [
  "**/test/**",
  "**/tests/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

# ---------------------------------------------------------------------------
# Plugin source registry
# ---------------------------------------------------------------------------

[[source]]
name = "default"
default = true

# ---------------------------------------------------------------------------
# Plugin configuration
# ---------------------------------------------------------------------------

# GitHub Actions linting
[[plugin]]
name = "actionlint"

# Python security scanning
[[plugin]]
name = "bandit"

# Dependency vulnerability scanning
[[plugin]]
name = "osv-scanner"

# Python quality (SonarQube rules)
[[plugin]]
name = "radarlint-python"
mode = "comment"

# Text pattern detection (TODO/NOTE)
[[plugin]]
name = "ripgrep"
mode = "comment"

# Python formatting & linting
[[plugin]]
name = "ruff"
drivers = ["lint"]

# Secrets detection
[[plugin]]
name = "trufflehog"

# SAST scanning with custom rules
[[plugin]]
name = "semgrep"

# Markdown documentation linting
[[plugin]]
name = "markdownlint"

# YAML configuration linting
[[plugin]]
name = "yamllint"

# ---------------------------------------------------------------------------
# Per-plugin exclusions
# ---------------------------------------------------------------------------

# bandit and semgrep should not scan test files
[[exclude]]
plugins = ["bandit", "semgrep"]
file_patterns = ["tests/**", "**/test_*.py", "**/*_test.py"]

# ---------------------------------------------------------------------------
# Triage rules (suppress known false positives)
# ---------------------------------------------------------------------------

# Standard pytest assertions are not security risks.
[[triage]]
match.rules = ["bandit:B101"]
set.ignored = true

# TODO and NOTE comments are informational, not actionable issues.
# Covers both the ripgrep text-search hits and the radarlint S1135 rule
# (sonarlint's equivalent "track uses of TODO tags" check).
[[triage]]
match.rules = ["ripgrep:TODO", "ripgrep:NOTE", "radarlint-python:S1135"]
set.ignored = true

# f-string SQL in db.py interpolates a Path into read_csv('{csv_path}', ...).
# csv_path is constructed internally from DEFAULT_DATA_DIR, never from user
# input; DuckDB has no parameter binding for table identifiers or file paths.
[[triage]]
match.rules = ["semgrep:sql-injection-format-string", "bandit:B608"]
match.file_patterns = ["src/gleif/db.py"]
set.ignored = true

# f-string SQL in queries.py interpolates only _ENTITY_COLS, a module-level
# constant containing literal column names. All user-supplied values use
# DuckDB $1/$2 parameter placeholders.
[[triage]]
match.rules = ["semgrep:sql-injection-format-string", "bandit:B608"]
match.file_patterns = ["src/gleif/queries.py"]
set.ignored = true

# MkDocs admonitions require 4-space-indented fenced code blocks; markdownlint
# treats these as "indented style" mixed with fenced, producing false positives.
[[triage]]
match.rules = ["markdownlint:MD046"]
match.file_patterns = ["docs/**"]
set.ignored = true
