# Registry of reusable workflows defined in this repo.
# last_verified must be within 90 days or CI-024 fires.
last_verified: "2026-05-14"

workflows:
  - file: .github/workflows/reusable-python-test.yml
    description: "Python test suite with coverage reporting"
    produces_checks: []  # called as nested reusable, no direct check run

  - file: .github/workflows/reusable-python-quality.yml
    description: "Ruff format, ruff lint, basedpyright type check"
    produces_checks: []

  - file: .github/workflows/reusable-security-analysis.yml
    description: "Bandit SAST, OSV vulnerability scan, dependency review, security gate"
    produces_checks:
      - name: "Security Gate Validation"
        calling_job_prefix: "Security Analysis"
        full_check_name: "Security Analysis / Security Gate Validation"

  - file: .github/workflows/reusable-python-release.yml
    description: "Build wheel and sdist, sign with Sigstore, create GitHub release with SBOM"
    produces_checks: []

  - file: .github/workflows/reusable-qlty-coverage.yml
    description: "Upload coverage.xml to Qlty Cloud"
    produces_checks: []

  - file: .github/workflows/reusable-scorecard.yml
    description: "OpenSSF Scorecard analysis with SARIF publishing"
    produces_checks: []

  - file: .github/workflows/reusable-codeql.yml
    description: "GitHub CodeQL advanced security analysis for Python"
    produces_checks: []
